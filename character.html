<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your character</title>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js" ></script>
</head>
<body>
    <main class="character-page">   
        
        <div class="character-model">
            
            <model-viewer
            alt="Mochi, a 3D Character"
            src="./characters/Mochi-blue.glb"
            camera-controls
            auto-rotate
            shadow-intensity="1">
        </model-viewer>  
        </div>
        <div class="character-info">

            <h1 id="character-name"></h1>
            <p id="character-description"></p>

          <section class="character-facts">
            <h2>Character Facts</h2>
            <p><strong>Personality</strong> <span id="personality"></span></p>
            <p><strong>Favourite food</strong><span id="food"></span></p>
            <p><strong>Special skill</strong> <span id="skill"></span></p>
          </section>
          
            <a class="back-link" href="./index.html">. Back to characters</a>
        </div>
    </main>
    <script src="./js/character.js"></script>
</body>
</html>
