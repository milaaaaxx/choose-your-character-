<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <h1>Choose Your Character</h1>2
        <p>Pick a character to meet your new pal</p>
        <div class="character-preview">
            <div class="character-placeholder"> Your character</div>
            <h2 id="selected-name">Choose your pal</h2>
            <p id="message">Pick one of the characters below</p>
        </div>
        <section class="characters">
            <button class="character" data-name="Mochi" data-description="Cute cat who is always looking for a the next adventure">Mochi</button>
            <button class="character" data-name="Ash" data-description="An teddybear who is extremely strong and super duper adorableeee">Ash</button>
            <button class="character" data-name="Mila" data-description="Pigiun who loves cuddles">Mila</button>
            <button class="character" data-name="Milo" data-description="An goofy duck who is always happy">Milo</button>
            <button class="character" data-name="Nonna" data-description="Smartass fox who thinks she knows everything">Nonna</button>
        </section>
        

    </main>
    <script src="./js/main.js"></script>
</body>
</html>
