<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <h1>Choose Your Character</h1>
        <p>Pick a character to meet your new pal</p>
        <div class="character-preview">
            <div class="character-placeholder"> Your character</div>
            <h2 id="selected-name">Choose your pal</h2>
            <p id="message">Pick one of the characters below</p>
        </div>
        <section class="characters">
            <button class="character" data-name="Mochi">Mochi</button>
            <button class="character" data-name="Ash">Ash</button>
            <button class="character" data-name="Mila">Mila</button>
            <button class="character" data-name="Milo">Milo</button>
            <button class="character" data-name="Nonna">Nonna</button>
        </section>
        
        <p id="message">Choose a character above!</p>
    </main>
    <script src="./js/main.js"></script>
</body>
</html>
